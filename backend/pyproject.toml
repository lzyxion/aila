[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aila-backend"
version = "0.1.0"
description = "AILA - Loki 기반 AI 로그 분석기 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "cryptography>=43.0",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    # 기본 admin 세션(conftest._default_admin_session)에서 빠져나와 실제 인증 경로를 탄다.
    "real_auth: 인증·권한 자체를 검증하는 테스트 (쿠키·401·403·만료)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
