[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: keep this file ASCII-only. Alembic reads alembic.ini with the OS locale
# encoding (cp949 on Korean Windows), so non-ASCII comments break `alembic` on Windows.
# sqlalchemy.url is injected from AILA_DATABASE_URL in alembic/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
