# Loki 데이터소스 프로비저닝.
# 이 Grafana 는 제품 UI 가 아니라 "로그가 Loki 에 실제로 들어갔는가" 를 눈으로 보는 용도다.
apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: aila-loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      # 백엔드 max_lines_per_query 와 같은 값으로 맞춰, Grafana 에서 본 결과와
      # 백엔드 조회 결과가 서로 다른 상한에 걸리는 혼란을 없앤다.
      maxLines: 5000
      timeout: 60
