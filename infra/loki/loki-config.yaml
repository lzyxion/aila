# Loki 3.x 단일 바이너리(all-in-one) + filesystem 저장.
# 로컬 데모 전용 — 인증 없음, 복제 없음, 보관 7 일.
#
# AILA 백엔드는 이 Loki 를 **읽기만** 한다 (query_range / count_over_time).
# 쓰기는 Alloy 만 한다.

auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  # 백엔드 query_timeout(기본 30s) 보다 넉넉하게
  http_server_read_timeout: 60s
  http_server_write_timeout: 60s
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  # structured metadata 사용 (Alloy 가 request_id 를 라벨이 아닌 메타데이터로 붙인다)
  allow_structured_metadata: true
  # Grafana 의 Log volume 패널용
  volume_enabled: true
  retention_period: 168h
  # 데모라 과거 타임스탬프도 받아준다
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # 정책 상한과 별개인 Loki 자체 반환 한도. 백엔드 max_lines_per_query(5000) 와 맞춘다.
  max_entries_limit_per_query: 5000
  max_query_series: 5000
  max_query_length: 721h
  max_query_parallelism: 16
  # 라벨 폭주 방지 (demo-api 가 실수로 request_id 를 라벨로 올리는 것을 막는 안전망)
  max_label_names_per_series: 20
  max_streams_per_user: 0

ingester:
  chunk_idle_period: 1m
  chunk_retain_period: 30s
  # 데모에서 새 로그를 빨리 보고 싶으므로 짧게
  max_chunk_age: 5m
  wal:
    enabled: true
    dir: /loki/wal

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

# 로컬 데모에는 alert 대상이 없다. ruler 는 뜨기만 하면 된다.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# 패턴 추출(Grafana Explore 의 Patterns 탭). 그룹화 규칙 검증에 참고가 된다.
pattern_ingester:
  enabled: true

query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

frontend:
  max_outstanding_per_tenant: 2048

analytics:
  reporting_enabled: false
